[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-commands-cheatsheet"
version = "1.0.0"
description = "Linux command cheat sheet for Ubuntu, Fedora and Arch — offline desktop app"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Angel Herman" }]
keywords = ["linux", "cheatsheet", "ubuntu", "fedora", "arch", "gtk4", "libadwaita"]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Natural Language :: Spanish",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyGObject>=3.42",
]

[project.urls]
Homepage = "https://github.com/angelherman0130-cell/linux-commands-cheatsheet"
Source = "https://github.com/angelherman0130-cell/linux-commands-cheatsheet"
Issues = "https://github.com/angelherman0130-cell/linux-commands-cheatsheet/issues"

[project.scripts]
comandos-linux = "comandos_linux.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comandos_linux = ["datos/*.json", "*.css"]
